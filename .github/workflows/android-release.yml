name: Build and Publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release-key.jks" \
            -storepass android-release-store \
            -keypass android-release-key \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Release, OU=Build, O=foodlfgast, L=Unknown, ST=Unknown, C=DZ"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          STORE_PASSWORD: android-release-store
          KEY_PASSWORD: android-release-key
        run: gradle --no-daemon assembleRelease

      - name: Locate and rename APK
        id: apk
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "Release APK was not generated"; exit 1; }
          cp "$APK" foodlfgast-release.apk
          echo "path=foodlfgast-release.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "foodlfgast Android ${TAG}" \
            --notes "Automated Android release APK built from commit $GITHUB_SHA." \
            --target "$GITHUB_SHA"
